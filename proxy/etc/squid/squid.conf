http_port 3128
visible_hostname proxy

# Quem pode usar o proxy: so a LAN
acl lan src 10.0.1.0/24
acl pc2 src 10.0.1.11/32

# Destinos controlados por dominio
acl bloqueados dstdomain .bloqueado.lab
acl so_pc1 dstdomain .restrito.lab

# Ordem importa: a primeira regra que casar decide
http_access deny bloqueados
http_access deny pc2 so_pc1
http_access allow lan
http_access deny all

# Cache em memoria; objetos ficam "frescos" por no minimo 5 min
# (o http.server do web nao manda Cache-Control)
cache_mem 64 MB
maximum_object_size_in_memory 512 KB
refresh_pattern . 5 20% 4320

# Log de acessos: TCP_MISS, TCP_MEM_HIT, TCP_DENIED, TCP_TUNNEL...
access_log stdio:/var/log/squid/access.log squid
